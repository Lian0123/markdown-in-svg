        <m:bind target="payment" start-line="3" end-line="3"/>
        <m:bind target="shipping" start-line="4" end-line="4"/>
        <m:bind target="rule" start-line="6" end-line="6"/>
      </m:bindings>
    </m:document>
  </metadata>
