      <text x="536" y="265" font-size="21" font-weight="bold"><tspan x="536" y="265">Warehouse confirms</tspan><tspan x="536" y="292">successful payment, then</tspan><tspan x="536" y="319">arranges shipment.</tspan></text></g>
