<svg xmlns="http://www.w3.org/2000/svg" xmlns:m="https://example.org/ns/markdown-in-svg/0.1" version="1.1" width="920" height="510" viewBox="0 0 920 510">
  <title>Order workflow</title>
  <desc>The customer completes payment. The warehouse confirms successful payment before arranging shipment. Do not ship if payment has not succeeded.</desc>
  <metadata>
    <m:document version="0.1" profile="static" doc-id="urn:uuid:7eab91ae-9b9f-444b-a10f-88f57787c613" revision="1">
      <m:source media-type="text/markdown" dialect="commonmark-0.31.2" xml:space="preserve"><![CDATA[# Order workflow

1. The customer completes payment.
2. The warehouse confirms successful payment, then arranges shipment.

Rule: Do not ship if payment has not succeeded.
]]></m:source>
      <m:presentation root-ref="view" source-digest="sha256:fe875a8bfaeed4165e42a69c90f29d52e7e9ed1145188110345b63b06fb760f7" renderer="misvg-reference-layout" renderer-version="0.1.0"/>
