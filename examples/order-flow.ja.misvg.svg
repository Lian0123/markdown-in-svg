<svg xmlns="http://www.w3.org/2000/svg" xmlns:m="https://example.org/ns/markdown-in-svg/0.1" version="1.1" width="920" height="510" viewBox="0 0 920 510">
  <title>注文フロー</title>
  <desc>顧客が支払いを完了し、倉庫が支払い成功を確認してから出荷を手配する。支払いが成功していない場合は出荷しない。</desc>
  <metadata>
    <m:document version="0.1" profile="static" doc-id="urn:uuid:583a71bd-f207-4479-99b3-f2ca6c29d831" revision="1">
      <m:source media-type="text/markdown" dialect="commonmark-0.31.2" xml:space="preserve"><![CDATA[# 注文フロー

1. 顧客が支払いを完了する。
2. 倉庫が支払い成功を確認してから出荷を手配する。

規則：支払いが成功していない場合は出荷しない。
]]></m:source>
