  <title>訂單流程</title>
  <desc>客戶完成付款，倉庫確認付款成功後安排出貨。付款未成功，不得出貨。</desc>
  <metadata>
    <m:document version="0.1" profile="static"
      doc-id="urn:uuid:39e08420-5eb6-4e8b-a98c-0ff063781d5a" revision="1">
      <m:source media-type="text/markdown" dialect="commonmark-0.31.2" xml:space="preserve"><![CDATA[# 訂單流程

1. 客戶完成付款。
2. 倉庫確認付款成功後安排出貨。

規則：付款未成功，不得出貨。
]]></m:source>
